<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%237D745F%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2720%27 text-anchor=%27middle%27 font-family=%27Didot,Georgia%27 fill=%27%23f4ede3%27%3Et%3C/text%3E%3C/svg%3E">
  <title>Shop — House of Tarigai</title>
  <meta name="description" content="Shop hand-smocked frocks, jhablas, kurta sets, sleepwear, bonnets and nursery heirlooms for children.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>

  <main id="main">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="js-crumb">Shop</span></nav>
    <div class="js-banner"></div>
    <header class="shop-head">
      <div><h1 class="js-title">Shop All</h1><p class="js-sub">Heirloom pieces, handcrafted in small batches.</p></div>
    </header>
    <div class="qcats js-qcats"></div>

    <div class="shop">
      <aside class="filters" aria-label="Filters">
        <div class="filters__head"><h3>Filters</h3><button class="js-clear">Clear all</button></div>
        <div class="js-facets"></div>
      </aside>
      <div class="filters__foot"><button class="btn btn--line js-clear">Clear</button><button class="btn btn--dark js-apply">Show results</button></div>
      <div class="filters-scrim js-filters-close"></div>

      <section aria-label="Products">
        <div class="toolbar">
          <p class="toolbar__count js-results"></p>
          <div class="toolbar__right">
            <label class="sort">Sort by
              <select class="js-sort">
                <option value="recommended">Recommended</option>
                <option value="new">What's New</option>
                <option value="popular">Popularity</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="discount">Better Discount</option>
                <option value="rating">Customer Rating</option>
              </select>
            </label>
            <div class="density" aria-label="Grid columns"><button data-cols="3">3</button><button data-cols="4">4</button></div>
          </div>
        </div>
        <div class="applied js-applied"></div>
        <div class="pgrid js-grid"></div>
        <div class="loadmore js-more"></div>
      </section>
    </div>

    <div class="mobile-tools">
      <label><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Sort<select class="js-sort" aria-label="Sort"></select></label>
      <button class="js-filters-open"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filter <span class="js-fcount"></span></button>
    </div>
  </main>

  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
