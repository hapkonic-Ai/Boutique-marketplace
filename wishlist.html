<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%23f2d7cf%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2716%27 text-anchor=%27middle%27 font-family=%27Georgia%27 fill=%27%232b2622%27%3ELB%3C/text%3E%3C/svg%3E">
  <title>Wishlist — Little Bloom Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body data-page="wishlist">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-header></div>
  <main id="main">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>Wishlist</span></nav>
    <header class="page-hero"><h1 class="h2">Wishlist <span class="muted js-wcount" style="font-size:.5em"></span></h1><p class="lede">Pieces you've fallen for. Saved on this device.</p></header>
    <div class="pgrid js-wish" style="padding-bottom:100px"></div>
  </main>
  <div data-footer></div>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script>
    (() => {
      const root = LB.$('.js-wish');
      const render = () => {
        const list = LB.wish().map(LB.byId).filter(Boolean);
        LB.$('.js-wcount').textContent = list.length ? `(${list.length})` : '';
        root.innerHTML = list.length ? list.map(p => LB.card(p, { eager: true }).replace('</article>',
          `<div class="hero__ctas" style="margin-top:12px;gap:14px"><a class="btn btn--sm btn--dark" href="product.html?id=${p.id}">Choose size</a><button class="link-u" data-wish="${p.id}">Remove</button></div></article>`)).join('')
          : `<div class="empty" style="grid-column:1/-1"><h3>Your wishlist is empty</h3><p class="muted">Tap the ♡ on any piece to save it here.</p><a href="shop.html" class="btn btn--dark">Discover the Shop</a></div>`;
      };
      document.addEventListener('lb:change', render);
      render();
    })();
  </script>
</body>
</html>
